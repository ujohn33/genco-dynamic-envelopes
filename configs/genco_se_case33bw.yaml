# gridfm-graphkit config: GENCO (GNS_heterogeneous) in StateEstimation mode on case33bw.
# Sparse metering: during training each sample draws a random measurement set
# (mask_ratio = share NOT measured): ~15% of bus voltages, ~5% of bus P/Q injections
# and ~5% of branch flows, 1% relative Gaussian noise, no outliers. Home loads (incl.
# EV / heat-pump behaviour) are therefore mostly unobserved; the model gets no load
# forecast. At inference gencodoe.se_envelopes imposes a fixed placement instead.
# Data: the 40k envelope-like case33bw rows of scripts/make_training_data.py.
# Losses as graphkit's SE example (per-dimension MAE on Vm, Va, P_in, Q_in); lr 1e-4 as
# for the case33bw PF model (5e-4 gave loss spikes on this feeder).
version: 1
callbacks:
  patience: 12
  tol: 0
  early_stopping_monitor: Validation loss
  checkpoint_monitor: Validation loss
  lr_scheduler_monitor: Validation loss
task:
  task_name: StateEstimation
  noise_type: Gaussian
  relative_measurement: true
  measurements:
    vm:
      mask_ratio: 0.85
      outlier_ratio: 0.0
      std: 0.01
    power_inj:
      mask_ratio: 0.95
      outlier_ratio: 0.0
      std: 0.01
    power_flow:
      mask_ratio: 0.95
      outlier_ratio: 0.0
      std: 0.01
data:
  baseMVA: 10
  mask_value: 0.0
  normalization: HeteroDataMVANormalizer
  networks:
  - case33bw
  scenarios:
  - 40000
  split_by_load_scenario_idx: true
  test_ratio: 0.1
  val_ratio: 0.1
  workers: 8
  stream_partitions: auto
model:
  attention_head: 8
  edge_dim: 10
  hidden_size: 48
  input_bus_dim: 15
  input_gen_dim: 6
  output_bus_dim: 2
  output_gen_dim: 1
  num_layers: 12
  type: GNS_heterogeneous
optimizer:
  type: AdamW
  learning_rate: 0.0001
  optimizer_params:
    betas: [0.9, 0.999]
  scheduler_type: ReduceLROnPlateau
  scheduler_params:
    mode: min
    factor: 0.7
    patience: 5
seed: 0
training:
  batch_size: 64
  epochs: 60
  losses:
  - LossPerDim
  - LossPerDim
  - LossPerDim
  - LossPerDim
  loss_weights:
  - 0.35
  - 0.35
  - 0.1
  - 0.1
  loss_args:
  - dim: VM
    loss_str: MAE
  - dim: VA
    loss_str: MAE
  - dim: P_in
    loss_str: MAE
  - dim: Q_in
    loss_str: MAE
  accelerator: auto
  devices: auto
  strategy: auto
verbose: true
